{% extends "base.html" %}

{% block title %}Forgot Password | BloomTasks{% endblock %}

{% block content %}

<div class="simple-auth">

    <div class="auth-card">

        <div class="flower-icon">
            🔐
        </div>

        <h1>
            Forgot Password?
        </h1>

        <p class="auth-subtitle">
            Enter your registered email and we'll send you a verification code.
        </p>

        <form
            method="POST"
            action="{{ url_for('forgot_password') }}"
        >

            <label>
                Email Address
            </label>

            <input
                type="email"
                name="email"
                placeholder="Enter your registered email"
                required
            >

            <button
                type="submit"
                class="primary-btn"
            >
                Send Verification Code 💌
            </button>

        </form>

        <p class="auth-bottom">

            <a href="{{ url_for('login') }}">
                ← Back to Login
            </a>

        </p>

    </div>

</div>

{% endblock %}
