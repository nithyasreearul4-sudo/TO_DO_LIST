{% extends "base.html" %}

{% block title %}Reset Password | BloomTasks{% endblock %}

{% block content %}

<div class="simple-auth">

    <div class="auth-card">

        <div class="flower-icon">
            🌸
        </div>

        <h1>
            Reset Password
        </h1>

        <p class="auth-subtitle">
            Enter the verification code and create your new password.
        </p>

        <form
            method="POST"
            action="{{ url_for('reset_password') }}"
        >

            <label>
                Verification Code
            </label>

            <input
                type="text"
                name="otp"
                placeholder="Enter 6-digit OTP"
                maxlength="6"
                required
            >


            <label>
                New Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Create new password"
                minlength="6"
                required
            >


            <label>
                Confirm Password
            </label>

            <input
                type="password"
                name="confirm_password"
                placeholder="Confirm new password"
                minlength="6"
                required
            >


            <button
                type="submit"
                class="primary-btn"
            >
                Reset Password 🔐
            </button>

        </form>

    </div>

</div>

{% endblock %}
